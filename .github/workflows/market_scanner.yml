name: 24/7 Autonomous Market Scanner

on:
  schedule:
    # Runs every 30 minutes, Monday through Friday during market hours (13:30 - 20:00 UTC)
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime!

jobs:
  scan-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Autonomous Market Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python backend/autonomous_scanner.py

      - name: Commit & Push New Signals (if any)
        run: |
          git config --global user.name "SafeTrade AI Cloud Bot"
          git config --global user.email "bot@safetrade.ai"
          git add backend/data/signals_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Safe trade signals detected" && git push)
